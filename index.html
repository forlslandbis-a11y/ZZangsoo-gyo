<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>짱수교</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700;900&amp;family=Noto+Sans+KR:wght@400;500&amp;display=swap">
<style>
:root{--bg:#FBFAF7;--fg:#3F392E;--muted:#5E574A;--rule:#D6D3CD;--accent:#6B2D2D;--btnbg:#3F392E;--btnfg:#FBFAF7;--panel:#F1EFE9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1915;--fg:#ECE7DB;--muted:#B9B2A3;--rule:#4A453B;--accent:#E2A9A2;--btnbg:#ECE7DB;--btnfg:#1B1915;--panel:#25221D}}
:root[data-theme="dark"]{--bg:#1B1915;--fg:#ECE7DB;--muted:#B9B2A3;--rule:#4A453B;--accent:#E2A9A2;--btnbg:#ECE7DB;--btnfg:#1B1915;--panel:#25221D}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Pretendard,'Noto Sans KR',sans-serif;line-height:1.7;font-size:16px}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
.serif{font-family:'Noto Serif KR',serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 28px}
header{border-bottom:1px solid var(--rule)}
header .wrap{display:flex;flex-wrap:wrap;gap:10px 32px;align-items:center;justify-content:space-between;padding-top:16px;padding-bottom:16px}
.brand{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:700}
nav{display:flex;gap:6px 28px;flex-wrap:wrap}
nav a{padding:10px 0;font-weight:500;border-bottom:1px solid transparent}
nav a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.btn{display:inline-block;min-height:44px;padding:10px 26px;border:1px solid var(--btnbg);background:var(--btnbg);color:var(--btnfg);cursor:pointer;font-weight:500;border-radius:0}
.btn.line{background:transparent;color:var(--fg)}
.btn.line:hover{background:var(--panel)}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#auth{display:flex;align-items:center;gap:14px}
.hero{text-align:center;padding:88px 0 0}
.hero h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(38px,7vw,76px);line-height:1.25;letter-spacing:-0.02em;margin:0 0 28px}
.hero p{max-width:600px;margin:0 auto 36px;font-size:18px;color:var(--muted)}
.hero .cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:64px}
.arch{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.arch *{fill:none;stroke:var(--accent);stroke-width:1.5}
section{padding:96px 0 0}
h2{font-family:'Noto Serif KR',serif;font-size:34px;font-weight:700;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 32px}
.reader{display:flex;flex-wrap:wrap;gap:40px 64px;border-top:1px solid var(--fg);padding-top:32px}
.toc{flex:1 1 200px;display:flex;flex-direction:column}
.toc button{text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 0;cursor:pointer;min-height:44px}
.toc button:hover{color:var(--accent)}
.toc button[aria-current="true"]{font-weight:700;color:var(--accent)}
.pane{flex:3 1 420px;max-width:720px}
.pane h3{font-family:'Noto Serif KR',serif;font-size:26px;margin:0 0 20px}
.verse{font-family:'Noto Serif KR',serif;line-height:2;margin:0 0 20px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:20px;color:var(--muted);font-size:14px}
.tools button{min-width:44px;min-height:44px;background:none;border:1px solid var(--rule);cursor:pointer}
.tools button:hover{background:var(--panel)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:32px;border-top:1px solid var(--rule);padding-top:20px}
.board-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--fg);padding-bottom:10px}
.note{font-size:14px;color:var(--muted)}
form.write{display:grid;gap:12px;margin:24px 0;padding:20px;background:var(--panel);border:1px solid var(--rule)}
label{font-size:14px;font-weight:500;display:block;margin-bottom:4px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--muted);background:var(--bg);border-radius:0}
textarea{min-height:110px;resize:vertical}
details{border-bottom:1px solid var(--rule)}
summary{list-style:none;cursor:pointer;padding:16px 0;display:flex;flex-wrap:wrap;gap:4px 20px;justify-content:space-between;min-height:44px}
summary::-webkit-details-marker{display:none}
summary:hover .pt{color:var(--accent);text-decoration:underline}
.meta{color:var(--muted);font-size:14px}
.body{white-space:pre-wrap;padding:0 0 18px;margin:0}
.del{background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;padding:8px 0;min-height:44px}
dialog{border:1px solid var(--fg);background:var(--bg);color:var(--fg);padding:28px;max-width:380px;width:calc(100% - 32px);border-radius:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
.joke{background:var(--panel);border-bottom:1px solid var(--rule);text-align:center;font-size:14px;color:var(--muted);padding:8px 16px}
.live{color:var(--accent)}
footer{margin-top:96px;border-top:1px solid var(--rule);padding:28px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
</style>
</head>
<body>
<div class="joke" role="note">⚠ 장난으로 만든 가상의 종교(패러디) 페이지입니다. 실제 종교·단체와 아무 관련이 없습니다.</div>
<header>
<div class="wrap">
<a class="brand" href="#top" data-name>짱수교</a>
<nav aria-label="주 메뉴"><a href="#scripture">경전 읽기</a><a href="#board">자유게시판</a></nav>
<div id="auth"></div>
</div>
</header>

<main id="top">
<div class="wrap hero">
<h1>이수는 짱수이며,<br>그의 신도는 위대하다</h1>
<p><span data-name>짱수교</span>의 경전을 읽고, 같은 길을 걷는 이들과 이야기를 나누는 공간입니다.</p>
<div class="cta"><a class="btn" href="#scripture">경전 읽기</a><a class="btn line" href="#board">자유게시판</a></div>
<svg class="arch" viewBox="0 0 340 420" aria-hidden="true"><path d="M8 420V178a162 162 0 0 1 324 0V420"/><path d="M48 420V184a122 122 0 0 1 244 0V420"/><circle cx="170" cy="250" r="34"/><path d="M170 216v68M136 250h68"/></svg>
</div>

<section id="scripture"><div class="wrap">
<h2>경전 읽기</h2>
<p class="lead">교리 요강을 장별로 읽을 수 있습니다.</p>
<div class="reader">
<div class="toc" id="toc" role="navigation" aria-label="장 목록"></div>
<div class="pane">
<div class="tools"><span>글자 크기</span><button id="fs-" aria-label="글자 작게">가−</button><button id="fs+" aria-label="글자 크게">가+</button></div>
<h3 id="ch-title"></h3>
<div id="ch-body"></div>
<div class="pager"><button class="btn line" id="prev">이전 장</button><button class="btn line" id="next">다음 장</button></div>
</div>
</div>
</div></section>

<section id="board"><div class="wrap">
<div class="board-head"><h2 style="margin:0">자유게시판</h2><span class="note" id="board-note"></span></div>
<div id="write-area"></div>
<div id="posts"></div>
</div></section>
</main>

<footer><div class="wrap"><div class="serif" data-name>짱수교</div><div>© <span data-name>짱수교</span> · 장난입니다. 진짜 아님!</div></div></footer>

<dialog id="login" aria-labelledby="login-h">
<form method="dialog" id="login-form">
<h3 id="login-h" class="serif" style="margin:0 0 6px;font-size:22px">로그인 / 가입</h3>
<p class="note" style="margin:0 0 16px">아이디는 영문 소문자·숫자 3~20자입니다. 처음이면 닉네임을 적고 가입을 누르세요.</p>
<label for="nick">아이디</label>
<input id="nick" maxlength="20" required autocomplete="username">
<label for="pw" style="margin-top:12px">비밀번호 (6자 이상)</label>
<input id="pw" type="password" maxlength="40" required autocomplete="current-password">
<label for="nick-display" style="margin-top:12px">표시 닉네임 (가입할 때만)</label>
<input id="nick-display" maxlength="20">
<p id="login-err" class="note" role="alert" style="color:var(--accent);margin:12px 0 0;min-height:1.7em"></p>
<div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap">
<button type="button" class="btn line" id="login-cancel">취소</button>
<button type="button" class="btn line" id="signup-btn">가입</button>
<button type="submit" class="btn">로그인</button>
</div>
</form>
</dialog>

<script type="module">
/* ▼▼▼ 여기에 Firebase 콘솔의 firebaseConfig 값을 붙여넣으세요 ▼▼▼ */
const firebaseConfig = {
  apiKey: "AIzaSyCKxEkvWWCjmlIwoukcpRmJ00fqlC1dDLw",
  authDomain: "zzangsoo-gyo.firebaseapp.com",
  projectId: "zzangsoo-gyo",
  storageBucket: "zzangsoo-gyo.firebasestorage.app",
  messagingSenderId: "100940757392",
  appId: "1:100940757392:web:8ba26f602ae5802376db15"
};
/* ▲▲▲ */

/* Firebase는 페이지가 뜬 뒤에 따로 불러옵니다. 불러오기에 실패해도 경전·화면은 정상 표시됩니다. */
const configured = !firebaseConfig.apiKey.startsWith("여기에");
let fb = null;                                   // 불러오기에 성공하면 채워짐
let fbState = configured ? "loading" : "nocfg";  // loading | ready | failed | nocfg
const fbMsg = () => configured ? "Firebase를 불러오는 중이거나 불러오지 못했습니다. 잠시 후 다시 시도해 주세요." : "Firebase 설정(firebaseConfig)이 아직 비어 있습니다.";

const ORDER_NAME = "짱수교";


const CHAPTERS = [
{t:"제1장 짱수는 무엇인가", v:[
["1-1조","짱수는 날아다니는 스파게티 괴물이 미완성된 우주를 창조한 상태에서, 땅과 우주(딸기와 우유라는 해석도 존재한다.)의 기운이 모여 만들어졌다."],
["1-2조","짱수는 우주에 과도하게 많은 음식을 치우고 항성과 위성을 창조하였다."],
["1-3조","그와 동시에 짱수는 지구에 물과 생명을 내리고 30억년 간 첫 잠에 들었으니, 이를 1차 휴면기라 부른다."],
["1-4조","30억년 후 공룡들에게 괴롭힘받던 고대생물들이 이수는 짱수다를 외치며 봉인을 푼 끝에, 짱수는 깨어났다."],
["1-5조","짱수는 고대생물들을 괴롭히던 공룡들을 운석으로 없애버리고, 포유류를 진화시켜 인간을 창조했다."],
["1-6조","인간을 창조한 짱수는 인간의 몸에 들어가 잠에 들었다. 이는 현재까지 일어나고 있는 2차 휴면기이다."]]},
{t:"제2장 가르침", v:[
["2-1조","이수는 짱수다를 외치어 봉인을 풀라."],
["2-2조","모든 종교는 결국 짱수로 귀결된다. 그러니, 다른 종교를 가진 이를 미워하지 말라."],
["2-3조","짱수께서 진화시킨 모든 인간의 뿌리는 같으니 다른 이를 차별하지 말라."],
["2-4조","성스러운 날에는 딸기나 우유, 혹은 딸기우유를 먹어라."],
["2-5조","‘이다솜은 모던이다’를 외치는 것도 매우 큰 도움이 된다."]]},
{t:"제3장 축일과 위계", v:[
["3-1조","짱수교의 축일은 교시일 11월 16일, 짱수 탄신일로 나뉜다."],
["3-2조","짱수교는 교주, 학도, 신도로 나뉘며, 각 계급의 위계는 없다."]]}
];

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})) {
    if (k === "text") e.textContent = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  kids.forEach(c => e.append(c));
  return e;
}
const $ = id => document.getElementById(id);

document.title = ORDER_NAME + " (장난)";
document.querySelectorAll("[data-name]").forEach(e => { e.textContent = ORDER_NAME; });

/* ---------- 로그인 (Firebase Auth) ---------- */
const toEmail = id => id.toLowerCase() + "@jjangsugyo.example";
const ID_RE = /^[a-z0-9]{3,20}$/;
let session = null;

const AUTH_MSG = {
  "auth/email-already-in-use": "이미 있는 아이디입니다.",
  "auth/weak-password": "비밀번호는 6자 이상이어야 합니다.",
  "auth/invalid-credential": "아이디 또는 비밀번호가 맞지 않습니다.",
  "auth/too-many-requests": "시도가 너무 많습니다. 잠시 후 다시 해주세요.",
  "auth/network-request-failed": "네트워크 연결을 확인해 주세요.",
  "auth/operation-not-allowed": "Firebase 콘솔에서 이메일/비밀번호 로그인이 아직 켜져 있지 않습니다."
};
const authErr = e => AUTH_MSG[e && e.code] || "처리하지 못했습니다. 잠시 후 다시 시도해 주세요.";

function renderAuth(){
  const box = $("auth"); box.replaceChildren();
  if (session) {
    box.append(h("span", {text: session.name + "님"}), h("button", {class:"btn line", text:"로그아웃", onclick(){ if (fb) fb.Au.signOut(fb.auth); }}));
  } else {
    box.append(h("button", {class:"btn line", text:"로그인", onclick(){ $("login").showModal(); $("nick").focus(); }}));
  }
}
function resetLogin(){ $("nick").value = ""; $("pw").value = ""; $("nick-display").value = ""; $("login-err").textContent = ""; }
$("login-cancel").addEventListener("click", () => { resetLogin(); $("login").close(); });

$("login-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (!fb) { $("login-err").textContent = fbMsg(); return; }
  const id = $("nick").value.trim(), pw = $("pw").value;
  try { await fb.Au.signInWithEmailAndPassword(fb.auth, toEmail(id), pw); resetLogin(); $("login").close(); }
  catch (e) { $("login-err").textContent = authErr(e); }
});

$("signup-btn").addEventListener("click", async () => {
  if (!fb) { $("login-err").textContent = fbMsg(); return; }
  const id = $("nick").value.trim().toLowerCase(), pw = $("pw").value, nick = $("nick-display").value.trim() || id;
  if (!ID_RE.test(id)) { $("login-err").textContent = "아이디는 영문 소문자·숫자 3~20자로 적어주세요."; return; }
  try {
    await fb.Au.createUserWithEmailAndPassword(fb.auth, toEmail(id), pw);
    await fb.Au.updateProfile(fb.auth.currentUser, { displayName: nick });
    session = { uid: fb.auth.currentUser.uid, name: nick };
    renderAuth(); renderBoard(); resetLogin(); $("login").close();
  } catch (e) { $("login-err").textContent = authErr(e); }
});

/* ---------- 경전 읽기 ---------- */
let cur = 0, fs = 18;
function renderChapter(){
  const c = CHAPTERS[cur];
  $("ch-title").textContent = c.t;
  const body = $("ch-body"); body.replaceChildren();
  c.v.forEach(([k, v]) => body.append(h("p", {class:"verse", style:"font-size:" + fs + "px"}, h("b", {text: k + " "}), v)));
  $("toc").querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-current", i === cur ? "true" : "false"));
  $("prev").disabled = cur === 0; $("next").disabled = cur === CHAPTERS.length - 1;
  $("prev").style.opacity = cur === 0 ? .4 : 1; $("next").style.opacity = cur === CHAPTERS.length - 1 ? .4 : 1;
}
CHAPTERS.forEach((c, i) => $("toc").append(h("button", {text: c.t, onclick(){ cur = i; renderChapter(); }})));
$("prev").addEventListener("click", () => { if (cur > 0) { cur--; renderChapter(); } });
$("next").addEventListener("click", () => { if (cur < CHAPTERS.length - 1) { cur++; renderChapter(); } });
$("fs-").addEventListener("click", () => { fs = Math.max(14, fs - 2); renderChapter(); });
$("fs+").addEventListener("click", () => { fs = Math.min(28, fs + 2); renderChapter(); });

/* ---------- 자유게시판 (Firestore 실시간) ---------- */
let posts = [], live = false;
const openIds = new Set();
const p2 = n => String(n).padStart(2, "0");
const fmt = ms => { const d = new Date(ms); return d.getFullYear() + "." + p2(d.getMonth()+1) + "." + p2(d.getDate()) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()); };

function setNote(msg, isLive){ const n = $("board-note"); n.textContent = msg; n.classList.toggle("live", !!isLive); }
function updateNote(){
  if (fbState === "nocfg") setNote("Firebase 설정이 필요합니다.");
  else if (fbState === "failed") setNote("Firebase를 불러오지 못했습니다. 새로고침하거나 광고 차단을 확인해 주세요.");
  else if (live) setNote("● 실시간 연결됨", true);
  else setNote("연결 중…");
}

function renderWrite(){
  const wa = $("write-area"); wa.replaceChildren();
  if (session && fb) {
    const t = h("input", {id:"p-title", maxlength:"80", required:"true"});
    const b = h("textarea", {id:"p-body", maxlength:"2000", required:"true"});
    wa.append(h("form", {class:"write", onsubmit(ev){
      ev.preventDefault();
      addPost({title:t.value.trim(), body:b.value.trim(), author:session.name, authorId:session.uid, createdAt:Date.now()});
      t.value = ""; b.value = "";
    }},
      h("div", {}, h("label", {for:"p-title", text:"제목"}), t),
      h("div", {}, h("label", {for:"p-body", text:"내용"}), b),
      h("div", {}, h("button", {type:"submit", class:"btn", text:"글 올리기"}))));
  } else {
    wa.append(h("p", {class:"note", style:"margin:20px 0", text:"글쓰기는 로그인 후에 할 수 있습니다."}));
  }
}

function renderPosts(){
  const list = $("posts"); list.replaceChildren();
  if (!posts.length) { list.append(h("p", {class:"note", text:"아직 올라온 글이 없습니다."})); return; }
  posts.forEach(p => {
    const d = h("details", {},
      h("summary", {}, h("span", {class:"pt", text:p.title}), h("span", {class:"meta", text:p.author + " · " + fmt(p.createdAt)})),
      h("p", {class:"body", text:p.body}));
    d.open = openIds.has(p.id);
    d.addEventListener("toggle", () => { d.open ? openIds.add(p.id) : openIds.delete(p.id); });
    if (session && session.uid === p.authorId) d.append(h("button", {class:"del", text:"삭제", onclick(){ removePost(p.id); }}));
    list.append(d);
  });
}

function renderBoard(){ updateNote(); renderWrite(); renderPosts(); }

async function addPost(data){
  if (!fb || !data.title || !data.body) return;
  try { await fb.F.addDoc(fb.F.collection(fb.db, "posts"), data); }
  catch (e) { setNote(e && e.code === "permission-denied" ? "권한이 없습니다. Firestore 규칙을 확인해 주세요." : "글을 올리지 못했습니다. 잠시 후 다시 시도해 주세요."); }
}
async function removePost(id){
  if (!fb) return;
  try { await fb.F.deleteDoc(fb.F.doc(fb.db, "posts", id)); }
  catch (e) { setNote("삭제하지 못했습니다."); }
}

/* 화면은 먼저 그리고, Firebase는 그다음에 연결합니다 */
renderAuth(); renderChapter(); renderBoard();

async function initFirebase(){
  if (!configured) return;
  try {
    const V = "https://www.gstatic.com/firebasejs/10.12.2/";
    const [A, Au, F] = await Promise.all([import(V + "firebase-app.js"), import(V + "firebase-auth.js"), import(V + "firebase-firestore.js")]);
    const app = A.initializeApp(firebaseConfig);
    fb = { auth: Au.getAuth(app), db: F.getFirestore(app), Au, F };
    fbState = "ready";
    Au.onAuthStateChanged(fb.auth, user => {
      session = user ? { uid: user.uid, name: user.displayName || user.email.split("@")[0] } : null;
      renderAuth(); renderBoard();
    });
    const timer = setTimeout(() => { if (!live) setNote("연결이 늦어지고 있어요…"); }, 10000);
    F.onSnapshot(F.query(F.collection(fb.db, "posts"), F.orderBy("createdAt", "desc"), F.limit(100)), snap => {
      live = !snap.metadata.fromCache;
      if (live) clearTimeout(timer);
      posts = snap.docs.map(d => ({id:d.id, ...d.data()}));
      updateNote(); renderPosts();
    }, () => { clearTimeout(timer); setNote("게시판을 불러오지 못했습니다."); });
  } catch (e) {
    fbState = "failed"; fb = null; renderBoard();
  }
}
initFirebase();
</script>
